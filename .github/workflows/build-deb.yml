name: Build .deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all packages
        run: |
          built=0
          for build_script in */build; do
            pkg=$(dirname "$build_script")
            echo "::group::$pkg"
            bash "$build_script" && rc=$? || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::$pkg: build failed (exit $rc)"
              exit 1
            fi
            echo "::endgroup::"
            built=1
          done
          if [ "$built" -eq 0 ]; then
            echo 'No packages found.'
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: debs-${{ github.sha }}
          path: '*/out.deb'
          if-no-files-found: ignore
