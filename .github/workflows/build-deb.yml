name: Build .deb

on:
  push:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          pkgs=$(for d in */; do [ -f "${d}build" ] && printf '"%s",' "${d%/}"; done | sed 's/,$//')
          echo "packages=[$pkgs]" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(cat ${{ matrix.package }}/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bash "${{ matrix.package }}/build"

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.package }}-${{ steps.version.outputs.value }}.deb
          path: '${{ matrix.package }}/out.deb'
          if-no-files-found: error
