name: Build .deb

on:
  push:
    branches:
      - main
    paths:
      - '*/VERSION'
  workflow_run:
    workflows:
      - Check for updates
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run points at the pre-update SHA, so inspect the current branch tip.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0

      - id: list
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              package_names=$(for d in */; do
                [ -f "${d}build" ] && printf '%s\n' "${d%/}"
              done)
              ;;
            push)
              if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                changed_files=$(git diff-tree --no-commit-id --root --name-only -r "$GITHUB_SHA")
              else
                changed_files=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
              fi
              package_names=$(printf '%s\n' "$changed_files" | awk -F/ '$2 == "VERSION" { print $1 }')
              ;;
            workflow_run)
              changed_files=$(git diff --name-only "$WORKFLOW_HEAD_SHA" HEAD)
              package_names=$(printf '%s\n' "$changed_files" | awk -F/ '$2 == "VERSION" { print $1 }')
              ;;
          esac

          packages=$(printf '%s\n' "$package_names" |
            sort -u |
            while IFS= read -r pkg; do
              if [ -n "$pkg" ] && [ -f "$pkg/build" ]; then
                printf '%s\n' "$pkg"
              fi
            done |
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Packages to build: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: latest
          RELEASE_TARGET: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Using existing release $RELEASE_TAG."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --target "$RELEASE_TARGET" \
              --title "Latest Debian Packages" \
              --notes "This release is updated automatically." \
              --draft
          fi

  build:
    needs:
      - discover
      - prepare-release
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}

      - name: Read version
        id: version
        run: echo "value=$(cat ${{ matrix.package }}/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bash "${{ matrix.package }}/build"

      - name: Stage build output
        run: cp "${{ matrix.package }}/out.deb" "${{ matrix.package }}.deb"

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.package }}-${{ steps.version.outputs.value }}.deb
          path: '${{ matrix.package }}.deb'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: '*.deb'
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: latest
        run: |
          if [ -z "$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)" ]; then
            echo 'No Debian packages found.'
            exit 1
          fi

          gh release upload "$RELEASE_TAG" release/*.deb \
            --repo "$GH_REPO" \
            --clobber
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
